services:


  # PostgreSQL
 
  postgres:
    image: postgres:16
    container_name: ride-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ride_hailing}
      POSTGRES_USER: ${POSTGRES_USER:-ride_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ride_password}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ride_admin} -d ${POSTGRES_DB:-ride_hailing}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10



  # Apache Kafka - KRaft mode
  
  kafka:
    image: apache/kafka:3.9.1
    container_name: ride-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:

      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller


      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Single-node development cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10


  # Kafka Topic Initializer

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: ride-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint: ["/bin/bash", "-c"]

    command: >
      "
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic ride_telemetry
      --partitions 3
      --replication-factor 1
      &&
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic vehicle_expenses
      --partitions 2
      --replication-factor 1
      &&
      echo 'Kafka topics initialized successfully'
      "


  # Prometheus

  prometheus:
    image: prom/prometheus:latest
    container_name: ride-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      postgres:
        condition: service_healthy



  # Grafana

  grafana:
    image: grafana/grafana:latest
    container_name: ride-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      prometheus:
        condition: service_started


volumes:
  postgres_data:
  grafana_data: