services:

  airflow:
    build:
      context: ./airflow
    container_name: ride-airflow
    restart: unless-stopped
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_EXPENSE_TOPIC: vehicle_expenses

      SIMULATED_DAY_MINUTES: ${SIMULATED_DAY_MINUTES:-5}
      SIMULATION_START_DATE: ${SIMULATION_START_DATE:-2026-09-28T00:00:00+00:00}

      # PostgreSQL access for the profitability reconciliation tasks
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ride_hailing}
      POSTGRES_USER: ${POSTGRES_USER:-ride_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ride_password}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/project

    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: ride-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ride_hailing}
      POSTGRES_USER: ${POSTGRES_USER:-ride_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ride_password}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Run on first start only (empty data volume), in name order
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/02_spark_tables.sql:/docker-entrypoint-initdb.d/02-spark-tables.sql:ro
      - ./database/03_profitability.sql:/docker-entrypoint-initdb.d/03-profitability.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ride_admin} -d ${POSTGRES_DB:-ride_hailing}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: ride-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:

      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Kafka listeners
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Single-node development cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: ride-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint: ["/bin/bash", "-c"]

    command: >
      "
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic ride_telemetry
      --partitions 3
      --replication-factor 1
      &&
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create
      --if-not-exists
      --topic vehicle_expenses
      --partitions 2
      --replication-factor 1
      &&
      echo 'Kafka topics initialized successfully'
      "


  spark:
    build:
      context: ./spark

    container_name: ride-spark
    restart: unless-stopped

    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ride_hailing}
      POSTGRES_USER: ${POSTGRES_USER:-ride_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ride_password}

      # Spark/Ivy needs a writable home directory
      HOME: /tmp

    volumes:
      # Structured Streaming checkpoints
      - spark_checkpoints:/tmp/spark-checkpoints

      # Persistent writable Ivy dependency cache
      - spark_ivy:/tmp/ivy

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]

      # Writable Ivy dependency cache
      - --conf
      - spark.jars.ivy=/tmp/ivy

      # Kafka + PostgreSQL dependencies
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7,org.postgresql:postgresql:42.7.7

      # Streaming application
      - /opt/spark-app/streaming_job.py


  prometheus:
    image: prom/prometheus:latest
    container_name: ride-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro

    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: ride-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      prometheus:
        condition: service_started

  api:
    build:
      context: ./api
    container_name: ride-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ride_hailing}
      POSTGRES_USER: ${POSTGRES_USER:-ride_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ride_password}
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data:
  grafana_data:
  spark_checkpoints:
  spark_ivy: